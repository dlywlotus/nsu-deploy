services:
  nginx:
    build: ./
    ports:
      - "8081:80"
    depends_on:
      - backend
      - frontend
      - rust-fs

  frontend:
    image: dlywlotus/nsu-frontend:latest

  backend:
    image: dlywlotus/nsu-backend:latest
    env_file:
      - ./.env
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m"
      POSTGRES_URL: "jdbc:postgresql://postgres:5432/nsu"
      POSTGRES_USERNAME: "postgres"
      POSTGRES_PASSWORD: "123"
      RUST_FS_URI: "http://rust-fs:9000"
      RUST_FS_ACCESS_KEY: "${RUST_FS_ACCESS_KEY}"
      RUST_FS_SECRET_KEY: "${RUST_FS_SECRET_KEY}"

  postgres:
    image: postgres:17
    environment:
      - POSTGRES_DB=nsu
      - POSTGRES_PASSWORD=123
      - POSTGRES_USER=postgres
    volumes:
      - db-data:/var/lib/postgresql/data

  rust-fs:
    image: rustfs/rustfs:latest
    environment:
      - RUSTFS_ACCESS_KEY="${RUST_FS_ACCESS_KEY}"
      - RUSTFS_SECRET_KEY="${RUST_FS_SECRET_KEY}"
      - RUSTFS_SERVER_DOMAINS=localhost
      - RUSTFS_CONSOLE_ENABLE=true

    ports:
      - "9001:9001"
    volumes:
      - rust-fs-data:/data

volumes:
  db-data:
  rust-fs-data:
